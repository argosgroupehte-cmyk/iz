<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMQ ARGOS – Portail Qualité</title>
<style>
/* =============================================
   DESIGN SYSTEM — ARGOS Bureau de Contrôle
   COFRAC N°3-0821 · MMQ rév. 9 · 2025
   ============================================= */
:root {
  --c-primary:    #1a3a6b;
  --c-primary-d:  #122b52;
  --c-primary-l:  #2a5298;
  --c-accent:     #c8a227;
  --c-accent-d:   #a08020;
  --c-ok:         #22c55e;
  --c-warning:    #f59e0b;
  --c-danger:     #ef4444;
  --c-bg:         #f0f4f8;
  --c-surface:    #ffffff;
  --c-border:     #dde3ec;
  --c-text:       #1e293b;
  --c-text-mid:   #475569;
  --c-text-light: #94a3b8;
  --c-pdf:        #dc2626;
  --c-xls:        #16a34a;
  --c-docx:       #2563eb;
  --c-htm:        #0891b2;
  --c-v2024:      #e65100;
  --nav-h:        auto;
  --radius:       8px;
  --shadow:       0 2px 8px rgba(0,0,0,.08);
  --shadow-md:    0 4px 20px rgba(0,0,0,.12);
  --transition:   .2s ease;
  --font:         'Segoe UI', Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; overflow-x: hidden; }
body { font-family: var(--font); background: var(--c-bg); color: var(--c-text); min-height: 100vh; overflow-x: hidden; max-width: 100vw; }

/* ===== UTILITAIRES ===== */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.flex { display: flex; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.gap-1 { gap: .4rem; }
.gap-2 { gap: .8rem; }
.hidden { display: none !important; }
.mt-1 { margin-top: .5rem; }
.mt-2 { margin-top: 1rem; }
.mt-3 { margin-top: 1.5rem; }

/* ===== LOGIN ===== */
#login-screen {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f2348 0%, #1a3a6b 50%, #0f2348 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem;
}
.login-card {
  background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  padding: 2.5rem; width: 100%; max-width: 500px;
}
.login-brand { text-align: center; margin-bottom: 2rem; }
.login-brand-name { font-size: 2rem; font-weight: 800; color: var(--c-primary); letter-spacing: 3px; }
.login-brand-sub { color: var(--c-text-mid); font-size: .85rem; }
.login-cofrac {
  display: inline-block; margin-top: .5rem;
  background: var(--c-primary); color: var(--c-accent);
  font-size: .75rem; font-weight: 700; letter-spacing: 1px;
  padding: .3rem .8rem; border-radius: 20px;
}
.login-section-title { font-size: .75rem; font-weight: 700; color: var(--c-text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: .75rem; }
.users-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-bottom: 1.5rem; }
.user-btn {
  background: var(--c-bg); border: 2px solid var(--c-border); border-radius: 10px;
  padding: .7rem .4rem; cursor: pointer; transition: var(--transition); text-align: center;
}
.user-btn:hover, .user-btn.selected {
  border-color: var(--c-primary); background: #e8edf5;
}
.user-btn.selected { border-color: var(--c-accent); background: #faf4e0; }
.user-initials {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--c-primary); color: #fff;
  font-size: .85rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; margin: 0 auto .4rem;
}
.user-btn.selected .user-initials { background: var(--c-accent); color: var(--c-primary); }
.user-name-label { font-size: .72rem; font-weight: 600; color: var(--c-text-mid); line-height: 1.2; }
.pin-display {
  background: var(--c-primary); border-radius: 10px; padding: 1rem;
  text-align: center; margin-bottom: 1rem; min-height: 60px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.pin-label { font-size: .7rem; color: rgba(255,255,255,.6); text-transform: uppercase; letter-spacing: 1px; margin-bottom: .4rem; }
.pin-dots { display: flex; gap: .5rem; }
.pin-dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.4); transition: var(--transition); }
.pin-dot.filled { background: var(--c-accent); border-color: var(--c-accent); }
.pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.pin-key {
  background: var(--c-bg); border: 2px solid var(--c-border); border-radius: 10px;
  padding: .9rem; font-size: 1.2rem; font-weight: 700; cursor: pointer;
  transition: var(--transition); text-align: center; color: var(--c-text);
  user-select: none;
}
.pin-key:hover { background: #dde3ec; border-color: var(--c-primary-l); }
.pin-key:active { transform: scale(.95); }
.pin-key.del { font-size: .9rem; color: var(--c-danger); }
.pin-key.ok { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
.pin-key.ok:hover { background: var(--c-primary-d); }
.pin-error { color: var(--c-danger); text-align: center; font-size: .85rem; font-weight: 600; margin-top: .5rem; min-height: 1.2em; }

/* ===== APP SHELL ===== */
#app-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--c-primary); box-shadow: 0 2px 12px rgba(0,0,0,.25);
  max-width: 100%; overflow: hidden; box-sizing: border-box;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: .6rem 1.5rem; gap: 1rem; max-width: 100%; box-sizing: border-box;
}
.header-brand { display: flex; align-items: center; gap: 1rem; }
.brand-name { font-size: 1.2rem; font-weight: 800; color: #fff; letter-spacing: 2px; }
.brand-name span { color: var(--c-accent); }
.brand-sub { font-size: .72rem; color: rgba(255,255,255,.65); }
.header-cofrac {
  background: rgba(200,162,39,.15); border: 1px solid rgba(200,162,39,.4);
  color: var(--c-accent); font-size: .7rem; font-weight: 700; letter-spacing: 1px;
  padding: .25rem .7rem; border-radius: 20px;
}
.header-user { display: flex; align-items: center; gap: 1rem; }
.user-info { text-align: right; }
.user-name { font-size: .85rem; font-weight: 700; color: #fff; }
#header-role { font-size: .7rem; color: rgba(255,255,255,.6); }
.btn-logout {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
  color: #fff; padding: .4rem .9rem; border-radius: 6px; cursor: pointer;
  font-size: .78rem; font-weight: 600; transition: var(--transition);
}
.btn-logout:hover { background: rgba(255,255,255,.2); }

/* ===== NAVIGATION ===== */
#app-nav {
  display: flex; overflow-x: auto; scrollbar-width: none;
  background: var(--c-primary-d);
  border-top: 1px solid rgba(255,255,255,.1);
  max-width: 100%; box-sizing: border-box;
}
#app-nav::-webkit-scrollbar { display: none; }
.nav-tab {
  flex: 0 0 auto; padding: .45rem .6rem;
  border: none; background: transparent; color: rgba(255,255,255,.65);
  cursor: pointer; font-size: .78rem; font-weight: 600;
  transition: var(--transition); white-space: nowrap;
  display: flex; align-items: center; gap: .25rem;
  border-bottom: 3px solid transparent;
}
.nav-tab:hover { color: #fff; background: rgba(255,255,255,.05); }
.nav-tab.active { color: var(--c-accent); border-bottom-color: var(--c-accent); background: rgba(255,255,255,.08); }
.nav-tab .tab-ref { display: none; }

/* ===== MAIN CONTENT ===== */
#main-content { padding: 1.5rem; max-width: 1400px; margin: 0 auto; overflow-x: hidden; box-sizing: border-box; }

/* ===== CARDS DOCUMENTS ===== */
.doc-card {
  background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--radius);
  padding: 1rem; transition: var(--transition); position: relative;
  border-left: 4px solid transparent;
}
.doc-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.type-pdf  { border-left-color: var(--c-pdf); }
.type-xls  { border-left-color: var(--c-xls); }
.type-docx { border-left-color: var(--c-docx); }
.type-htm  { border-left-color: var(--c-htm); }
.doc-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; margin-bottom: .5rem; }
.doc-code { font-size: .7rem; font-weight: 700; color: var(--c-primary); text-transform: uppercase; letter-spacing: 1px; }
.doc-title { font-size: .9rem; font-weight: 600; color: var(--c-text); line-height: 1.3; }
.doc-meta { font-size: .75rem; color: var(--c-text-light); display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: .6rem; }
.doc-open {
  width: 100%; padding: .45rem; border-radius: 5px; border: 1px solid var(--c-border);
  background: var(--c-bg); color: var(--c-primary); font-size: .8rem; font-weight: 600;
  cursor: pointer; transition: var(--transition); text-align: center;
}
.doc-open:hover { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
.doc-btn-row { display: flex; gap: .4rem; }
.doc-btn-row .doc-open { flex: 1; }
.doc-edit {
  flex: 1; padding: .45rem; border-radius: 5px; border: 1.5px solid var(--c-primary);
  background: transparent; color: var(--c-primary); font-size: .8rem; font-weight: 600;
  cursor: pointer; transition: var(--transition); text-align: center;
}
.doc-edit:hover { background: var(--c-primary); color: #fff; }
.badge {
  font-size: .65rem; font-weight: 700; padding: .2rem .5rem; border-radius: 4px;
  white-space: nowrap; flex-shrink: 0;
}
.badge-pdf  { background: #fee2e2; color: var(--c-pdf); }
.badge-xls  { background: #dcfce7; color: var(--c-xls); }
.badge-docx { background: #dbeafe; color: var(--c-docx); }
.badge-htm  { background: #e0f2fe; color: var(--c-htm); }

/* ===== SECTIONS GRILLES ===== */
.docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
.docs-grid-wide { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
.calc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .7rem; }

/* ===== THEME PAGE ===== */
.theme-page-header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1.5rem; padding-bottom: 1rem;
  border-bottom: 2px solid var(--c-border);
}
.theme-page-ref {
  background: var(--c-primary); color: var(--c-accent);
  font-size: .8rem; font-weight: 800; letter-spacing: 1px;
  padding: .4rem .9rem; border-radius: 6px; white-space: nowrap;
}
.theme-page-icon { font-size: 1.8rem; }
.theme-page-title { font-size: 1.4rem; font-weight: 800; color: var(--c-primary); }

/* ===== EXTRAIT MMQ ===== */
.mmq-box {
  background: #f0f6ff; border: 1px solid #c5d8f0; border-left: 4px solid var(--c-primary);
  border-radius: var(--radius); margin-bottom: 1.5rem; overflow: hidden;
}
.mmq-box-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: .75rem 1rem; cursor: pointer; user-select: none;
}
.mmq-box-header:hover { background: #e5edf8; }
.mmq-box-label {
  display: flex; align-items: center; gap: .6rem;
  font-size: .82rem; font-weight: 700; color: var(--c-primary);
}
.mmq-box-ref { font-size: .72rem; color: var(--c-text-mid); font-weight: 400; }
.mmq-toggle { font-size: .8rem; color: var(--c-text-mid); transition: var(--transition); }
.mmq-toggle.open { transform: rotate(180deg); }
.mmq-box-content { padding: .75rem 1rem 1rem; border-top: 1px solid #c5d8f0; }
.mmq-para {
  font-size: .83rem; color: var(--c-text-mid); line-height: 1.65;
  margin-bottom: .6rem;
}
.mmq-para:last-child { margin-bottom: 0; }
.mmq-para strong { color: var(--c-primary); font-weight: 700; }

/* ===== BLOCS THÈME ===== */
.theme-blocks { display: flex; flex-direction: column; gap: 1.5rem; }
.theme-block {}
.theme-block-title {
  display: flex; align-items: center; gap: .6rem;
  font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--c-text-mid); margin-bottom: .75rem; padding-bottom: .5rem;
  border-bottom: 1px solid var(--c-border);
}
.theme-block-title-icon { font-size: 1rem; }
.theme-block-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
@media (max-width: 700px) { .theme-block-row { grid-template-columns: 1fr; } }

/* ===== SECTION HEADER ===== */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--c-bg); border-radius: 6px; padding: .5rem .75rem;
  margin-bottom: .75rem; border-left: 3px solid var(--c-accent);
}
.section-title { font-size: .82rem; font-weight: 700; color: var(--c-text); }
.section-count { font-size: .72rem; color: var(--c-text-light); background: var(--c-border); padding: .15rem .5rem; border-radius: 10px; }

/* ===== AGENT CARDS ===== */
.agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
.agent-card {
  background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow);
}
.agent-card.archived { opacity: .6; }
.agent-header {
  display: flex; align-items: center; gap: .8rem; padding: .9rem 1rem;
  cursor: pointer; user-select: none; transition: background var(--transition);
  border-bottom: 2px solid var(--c-primary);
}
.agent-card.archived .agent-header { border-bottom-color: var(--c-text-light); }
.agent-header:hover { background: #f8fafc; }
.agent-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--c-primary); color: #fff;
  font-size: .9rem; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.agent-card.archived .agent-avatar { background: var(--c-text-light); }
.agent-info { flex: 1; }
.agent-name { font-size: .9rem; font-weight: 700; color: var(--c-text); }
.agent-role { font-size: .72rem; color: var(--c-text-mid); }
.agent-toggle { color: var(--c-text-light); transition: transform var(--transition); }
.agent-toggle.open { transform: rotate(180deg); }
.agent-body { display: none; padding: .75rem 1rem; }
.agent-body.open { display: block; }
.agent-doc-list { list-style: none; }
.agent-doc-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: .45rem 0; border-bottom: 1px solid var(--c-border); gap: .5rem;
}
.agent-doc-item:last-child { border-bottom: none; }
.agent-doc-label { font-size: .8rem; color: var(--c-text); flex: 1; line-height: 1.3; }
.agent-doc-btn {
  background: var(--c-bg); border: 1px solid var(--c-border);
  color: var(--c-primary); font-size: .72rem; font-weight: 600;
  padding: .25rem .6rem; border-radius: 4px; cursor: pointer;
  white-space: nowrap; transition: var(--transition);
}
.agent-doc-btn:hover { background: var(--c-primary); color: #fff; }
.agent-archived-label {
  font-size: .7rem; background: #f1f5f9; color: var(--c-text-light);
  font-weight: 700; letter-spacing: 1px; padding: .2rem .6rem;
  border-radius: 4px; text-transform: uppercase; margin-left: .5rem;
}

/* ===== CALC CARD ===== */
.calc-card {
  background: var(--c-surface); border: 1px solid var(--c-border); border-left: 4px solid var(--c-htm);
  border-radius: var(--radius); padding: .7rem .9rem;
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  transition: var(--transition);
}
.calc-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.calc-card-label { font-size: .82rem; font-weight: 600; color: var(--c-text); flex: 1; line-height: 1.3; }
.calc-open {
  background: var(--c-htm); color: #fff; border: none;
  font-size: .72rem; font-weight: 700; padding: .3rem .7rem;
  border-radius: 4px; cursor: pointer; white-space: nowrap; transition: var(--transition);
}
.calc-open:hover { background: #0e7490; }
.calc-card.v2024 { border-left-color: var(--c-v2024); background: #fff3e0; }
.calc-card.v2024 .calc-open { background: var(--c-v2024); }
.calc-card.v2024 .calc-open:hover { background: #bf360c; }
.calc-card.v2024 .calc-card-label { color: var(--c-v2024); }
.v2024-badge { display:inline-block; background:var(--c-v2024); color:#fff; font-size:.62rem; font-weight:700; padding:.1rem .4rem; border-radius:3px; margin-left:.4rem; vertical-align:middle; letter-spacing:.03em; }
.doc-card.v2024 { border-left-color: var(--c-v2024); background: #fff3e0; }
.doc-card.v2024 .doc-open { background: var(--c-v2024); }
.doc-card.v2024 .doc-open:hover { background: #bf360c; }

/* ===== ACCUEIL ===== */
.accueil-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; margin-top: 1.5rem; }
.accueil-card {
  background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--radius);
  padding: 1.2rem; box-shadow: var(--shadow); transition: var(--transition);
  display: flex; flex-direction: column; gap: .5rem;
}
.accueil-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.accueil-card-icon { font-size: 1.8rem; }
.accueil-card-title { font-size: .95rem; font-weight: 700; color: var(--c-primary); }
.accueil-card-desc { font-size: .8rem; color: var(--c-text-mid); flex: 1; }
.accueil-card-btn {
  margin-top: .5rem; padding: .45rem; border-radius: 5px;
  border: 1px solid var(--c-primary); background: transparent;
  color: var(--c-primary); font-size: .8rem; font-weight: 600; cursor: pointer; text-align: center;
  transition: var(--transition);
}
.accueil-card-btn:hover { background: var(--c-primary); color: #fff; }
.accueil-banner {
  background: linear-gradient(135deg, var(--c-primary) 0%, var(--c-primary-l) 100%);
  color: #fff; border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
}
.accueil-banner-title { font-size: 1.3rem; font-weight: 800; }
.accueil-banner-sub { font-size: .82rem; color: rgba(255,255,255,.75); margin-top: .3rem; }
.accueil-banner-badge {
  background: rgba(200,162,39,.2); border: 1px solid rgba(200,162,39,.5);
  color: var(--c-accent); font-weight: 700; font-size: .8rem; letter-spacing: 1px;
  padding: .5rem 1rem; border-radius: 8px; text-align: center;
}

/* ===== ADMIN ===== */
.admin-section { margin-bottom: 2rem; max-width: 100%; overflow: hidden; box-sizing: border-box; }
.admin-section-title {
  font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  color: var(--c-text-mid); margin-bottom: 1rem; padding-bottom: .5rem;
  border-bottom: 1px solid var(--c-border);
}
.pin-change-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
.pin-change-card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--radius); padding: 1rem; }
.pin-change-name { font-size: .85rem; font-weight: 700; color: var(--c-text); margin-bottom: .6rem; }
.pin-change-input {
  width: 100%; padding: .5rem; border: 1px solid var(--c-border); border-radius: 5px;
  font-size: .9rem; text-align: center; letter-spacing: 4px; margin-bottom: .6rem;
}
.btn-primary {
  width: 100%; padding: .5rem; background: var(--c-primary); color: #fff;
  border: none; border-radius: 5px; font-size: .82rem; font-weight: 600;
  cursor: pointer; transition: var(--transition);
}
.btn-primary:hover { background: var(--c-primary-d); }
.btn-danger {
  width: 100%; padding: .5rem; background: var(--c-danger); color: #fff;
  border: none; border-radius: 5px; font-size: .82rem; font-weight: 600;
  cursor: pointer; transition: var(--transition);
}
.btn-danger:hover { background: #b91c1c; }
.drive-info {
  background: #f0fdf4; border: 1px solid #86efac; border-left: 4px solid #22c55e;
  border-radius: var(--radius); padding: 1rem 1.2rem;
  overflow: hidden; box-sizing: border-box; max-width: 100%;
}
.drive-info-title { font-size: .85rem; font-weight: 700; color: #15803d; margin-bottom: .5rem; }
.drive-info-text { font-size: .82rem; color: #166534; line-height: 1.6; }
.drive-info-text code {
  background: #dcfce7; padding: .1rem .4rem; border-radius: 3px;
  font-family: monospace; font-size: .82rem;
}

/* ===== ASSISTANT CLAUDE ===== */
#claude-fab {
  position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 900;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--c-primary); color: #fff; border: none;
  font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.25);
  transition: var(--transition); display: none;
}
#claude-fab:hover { background: var(--c-primary-l); transform: scale(1.08); }

function p(path) {
  return path.split('/').map(function(seg){ return encodeURIComponent(seg).replace(/%2F/g,'/').replace(/%5C/g,'\\'); }).join('/');
}
function openDoc(path) {
  if (IS_ONLINE && DRIVE_INDEX) {
    // Chercher le fichier dans l'index Drive
    var id = DRIVE_INDEX[path];
    if (!id) {
      // Essayer sans accents / avec variantes
      var keys = Object.keys(DRIVE_INDEX);
      for (var i = 0; i < keys.length; i++) {
        if (keys[i].toLowerCase() === path.toLowerCase()) { id = DRIVE_INDEX[keys[i]]; break; }
      }
    }
    if (id) {
      window.open('https://drive.google.com/file/d/' + id + '/view', '_blank');
      return;
    }
    // Fichier .htm → vérifier si c'est le calculateur Iz V2024
    if (path.indexOf('Sections_V2024') !== -1) {
      window.open('https://argosgroupehte-cmyk.github.io/iz/?t=ARGOS', '_blank');
      return;
    }
    alert('Document non trouve sur Drive : ' + path);
    return;
  }
  window.open(p(path), '_blank');
}
function ext(f) { return (f.split('.').pop() || '').toLowerCase(); }
function extBadge(f) {
  const e = ext(f);
  if (e==='pdf')  return '<span class="badge badge-pdf">📄 PDF</span>';
  if (e==='xls'||e==='xlsx') return '<span class="badge badge-xls">📊 XLS</span>';
  if (e==='docx'||e==='doc') return '<span class="badge badge-docx">📝 DOCX</span>';
  if (e==='htm'||e==='html') return '<span class="badge badge-htm">🔧 HTM</span>';
  return '';
}
function typeClass(f) {
  const e = ext(f);
  if (e==='pdf')  return 'type-pdf';
  if (e==='xls'||e==='xlsx') return 'type-xls';
  if (e==='docx'||e==='doc') return 'type-docx';
  if (e==='htm'||e==='html') return 'type-htm';
  return '';
}
function makeDocCard({ code, titre, path, version, meta, pathEdit }, v2024) {
  const esc = s => s.replace(/'/g,"\\'");
  const buttons = pathEdit
    ? `<div class="doc-btn-row">
        <button class="doc-edit" onclick="openDoc('${esc(pathEdit)}')">✏ Modifier</button>
        <button class="doc-open" onclick="openDoc('${esc(path)}')">👁 Visualiser</button>
      </div>`
    : `<button class="doc-open" onclick="openDoc('${esc(path)}')">Ouvrir →</button>`;
  return `<div class="doc-card ${typeClass(path)}${v2024 ? ' v2024' : ''}">
    <div class="doc-card-top">
      <div>${code ? `<div class="doc-code">${code}</div>` : ''}<div class="doc-title">${titre}</div></div>
      ${extBadge(path)}
    </div>
    ${(version||meta) ? `<div class="doc-meta">${version?`<span>Version : ${version}</span>`:''} ${meta?`<span>${meta}</span>`:''}</div>` : ''}
    ${buttons}
  </div>`;
}
function today() {
  return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

// ── Authentification ──────────────────────────────────
const AUTH = (() => {
  const CREDS_KEY   = 'smq_credentials_v3';
  const SESSION_KEY = 'smq_session_v3';
  const TIMEOUT_MS  = 4 * 60 * 60 * 1000;
  let _activityTimer = null;
  let _credentials   = null;

  async function initDefaultCreds() {
    const existing = localStorage.getItem(CREDS_KEY);
    const creds = existing ? JSON.parse(existing) : {};
    let changed = false;
    const allUsers = ADMIN.getAllUsers();
    for (const [id, u] of Object.entries(allUsers)) {
      if (!creds[id]) {
        creds[id] = await sha256(u.defaultPin);
        changed = true;
      }
    }
    if (!existing || changed) localStorage.setItem(CREDS_KEY, JSON.stringify(creds));
  }

  function loadCreds() { _credentials = JSON.parse(localStorage.getItem(CREDS_KEY) || '{}'); }

  async function verify(userId, pin) {
    const hash = await sha256(pin);
    return hash === _credentials[userId];
  }

  function saveSession(userId) {
    const allUsers = ADMIN.getAllUsers();
    const u = allUsers[userId];
    if (!u) return;
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ userId, name: u.name, role: u.role, ts: Date.now() }));
    resetTimer();
  }

  function getSession() {
    try {
      const s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
      if (!s) return null;
      if (Date.now() - s.ts > TIMEOUT_MS) { sessionStorage.removeItem(SESSION_KEY); return null; }
      return s;
    } catch { return null; }
  }

  function resetTimer() {
    clearTimeout(_activityTimer);
    _activityTimer = setTimeout(() => { logout(); }, TIMEOUT_MS);
  }

  function logout() {
    clearTimeout(_activityTimer);
    sessionStorage.removeItem(SESSION_KEY);
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    LOGIN.reset();
  }

  document.addEventListener('click', () => { if (getSession()) resetTimer(); });

  return { initDefaultCreds, loadCreds, verify, saveSession, getSession, logout,
    async changePin(userId, newPin) {
      _credentials[userId] = await sha256(newPin);
      localStorage.setItem(CREDS_KEY, JSON.stringify(_credentials));
    },
    resetAllPins() {
      localStorage.removeItem(CREDS_KEY);
      location.reload();
    }
  };
})();

// ── Login UI ─────────────────────────────────────────
const LOGIN = (() => {
  let _sel = null; let _pin = '';
  const MAX_PIN = 4;

  function buildUsers() {
    const allUsers = ADMIN.getAllUsers();
    return Object.entries(allUsers).map(([id, u]) => `
      <div class="user-btn" data-id="${id}" onclick="LOGIN.selectUser('${id}')">
        <div class="user-initials">${u.initials}</div>
        <div class="user-name-label">${u.name.split(' ')[0]}</div>
      </div>`).join('');
  }

  function buildPad() {
    const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    return keys.map((k,i) => {
      if (!k) return `<div></div>`;
      if (k === '⌫') return `<button class="pin-key del" onclick="LOGIN.del()">⌫</button>`;
      return `<button class="pin-key" onclick="LOGIN.digit('${k}')">${k}</button>`;
    }).join('');
  }

  function buildDots() {
    return Array.from({length:MAX_PIN},(_,i)=>`<div class="pin-dot${i<_pin.length?' filled':''}"></div>`).join('');
  }

  function render() {
    document.getElementById('login-body').innerHTML = `
      <div class="login-section-title">Sélectionnez votre profil</div>
      <div class="users-grid">${buildUsers()}</div>
      <div class="pin-display">
        <div class="pin-label">${_sel ? 'Saisissez votre PIN' : 'Choisissez d\'abord un profil'}</div>
        <div class="pin-dots">${buildDots()}</div>
      </div>
      <div class="pin-grid">${buildPad()}</div>
      <div class="pin-error" id="pin-error"></div>`;
    if (_sel) document.querySelector(`[data-id="${_sel}"]`)?.classList.add('selected');
  }

  return {
    init() { render(); },
    reset() { _sel = null; _pin = ''; render(); },
    selectUser(id) { _sel = id; _pin = ''; render(); },
    digit(d) {
      if (!_sel) return;
      if (_pin.length >= MAX_PIN) return;
      _pin += d;
      if (_pin.length === MAX_PIN) setTimeout(() => this._validate(), 100);
      else updateDots();
    },
    del() { _pin = _pin.slice(0,-1); updateDots(); },
    async _validate() {
      const ok = await AUTH.verify(_sel, _pin);
      if (ok) {
        if (!localStorage.getItem('smq_device_user')) {
          localStorage.setItem('smq_device_user', _sel);
        }
        AUTH.saveSession(_sel);
        APP.show(AUTH.getSession());
      } else {
        document.getElementById('pin-error').textContent = 'PIN incorrect, réessayez.';
        _pin = '';
        updateDots();
        setTimeout(() => { const el = document.getElementById('pin-error'); if(el) el.textContent=''; }, 2000);
      }
    }
  };

  function updateDots() {
    const d = document.querySelector('.pin-dots');
    if (d) d.innerHTML = Array.from({length:MAX_PIN},(_,i)=>`<div class="pin-dot${i<_pin.length?' filled':''}"></div>`).join('');
  }
})();

// ── App Navigation ────────────────────────────────────
const APP = (() => {
  let _cur = null;

  function buildNav(role) {
    const nav = document.getElementById('app-nav');
    const tabs = THEMES.filter(t => t.roles.includes(role));
    nav.innerHTML = tabs.map(t => `
      <button class="nav-tab" data-id="${t.id}" onclick="APP.switchTab('${t.id}')">
        ${t.icon} ${t.label}
      </button>`).join('');
  }

  function buildHeader(sess) {
    document.getElementById('header-username').textContent = sess.name;
    document.getElementById('header-role').textContent = sess.role === 'admin' ? 'Administrateur' : 'Inspecteur';
  }

  return {
    show(sess) {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      buildHeader(sess);
      buildNav(sess.role);
      CLAUDE_ASSIST.showFab();
      const first = THEMES.find(t => t.roles.includes(sess.role));
      this.switchTab(first?.id || 'accueil');
    },
    switchTab(id) {
      _cur = id;
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.toggle('active', b.dataset.id === id));
      const sess = AUTH.getSession();
      const theme = THEMES.find(t => t.id === id);
      if (!theme) return;
      const mc = document.getElementById('main-content');
      if (theme.render === 'accueil')   mc.innerHTML = RENDERS.accueil(sess);
      else if (theme.render === 'admin') {
        mc.innerHTML = RENDERS.admin(sess);
        const ks = document.getElementById('admin-claude-status');
        if (ks) ks.textContent = localStorage.getItem('smq_claude_api_key') ? 'Cle configuree.' : 'Aucune cle configuree.';
        const su = document.getElementById('admin-share-url');
        if (su) su.value = localStorage.getItem('smq_share_url') || '';
        const ss = document.getElementById('admin-share-status');
        if (ss && localStorage.getItem('smq_share_url')) ss.textContent = 'Lien configure.';
        ADMIN._renderIzHistory();
      }
      else if (theme.render === 'methodes') mc.innerHTML = RENDERS.methodes(theme, sess);
      else if (theme.render === 'personnel') mc.innerHTML = RENDERS.personnel(theme, sess);
      else if (theme.render === 'documents') mc.innerHTML = RENDERS.documents(theme, sess);
      else if (theme.render === 'veille') mc.innerHTML = RENDERS.veille(theme, sess);
      else mc.innerHTML = RENDERS.theme(theme, sess);
    }
  };
})();

// ── Admin actions ─────────────────────────────────────
const ADMIN = {
  getAllUsers() {
    const custom = JSON.parse(localStorage.getItem('smq_custom_users') || '{}');
    const hidden = JSON.parse(localStorage.getItem('smq_hidden_users') || '[]');
    const all = {};
    for (const [id, u] of Object.entries(USERS_CONFIG)) {
      if (!hidden.includes(id)) all[id] = u;
    }
    for (const [id, u] of Object.entries(custom)) all[id] = u;
    return all;
  },
  getEmail(userId) {
    const stored = JSON.parse(localStorage.getItem('smq_user_emails') || '{}');
    const allUsers = this.getAllUsers();
    return stored[userId] || (allUsers[userId] && allUsers[userId].email) || '';
  },
  async saveUser(userId) {
    const emailInput = document.getElementById('email-' + userId);
    const pinInput = document.getElementById('pin-' + userId);
    if (emailInput) {
      const stored = JSON.parse(localStorage.getItem('smq_user_emails') || '{}');
      stored[userId] = emailInput.value.trim();
      localStorage.setItem('smq_user_emails', JSON.stringify(stored));
    }
    if (pinInput && pinInput.value.trim().length >= 4) {
      await AUTH.changePin(userId, pinInput.value.trim());
      pinInput.value = '';
    }
    alert('Utilisateur sauvegarde.');
  },
  async createUser() {
    const name = document.getElementById('new-user-name').value.trim();
    const id = document.getElementById('new-user-id').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    const email = document.getElementById('new-user-email').value.trim();
    const pin = document.getElementById('new-user-pin').value.trim();
    const role = document.getElementById('new-user-role').value;
    const initials = document.getElementById('new-user-initials').value.trim().toUpperCase();
    if (!name || !id || !pin || pin.length < 4 || !initials) {
      alert('Remplissez tous les champs (nom, identifiant, PIN 4+ chiffres, initiales).'); return;
    }
    const allUsers = this.getAllUsers();
    if (allUsers[id]) { alert('Cet identifiant existe deja.'); return; }
    const custom = JSON.parse(localStorage.getItem('smq_custom_users') || '{}');
    custom[id] = { name, role, initials, defaultPin: pin, email };
    localStorage.setItem('smq_custom_users', JSON.stringify(custom));
    if (email) {
      const emails = JSON.parse(localStorage.getItem('smq_user_emails') || '{}');
      emails[id] = email;
      localStorage.setItem('smq_user_emails', JSON.stringify(emails));
    }
    await AUTH.changePin(id, pin);
    APP.switchTab('admin');
  },
  deleteUser(userId) {
    if (userId === 'admin') { alert('Impossible de supprimer l\'administrateur.'); return; }
    const allUsers = this.getAllUsers();
    if (!allUsers[userId]) return;
    if (!confirm('Supprimer ' + allUsers[userId].name + ' ?')) return;
    if (USERS_CONFIG[userId]) {
      alert('Utilisateur par defaut desactive. Il ne sera plus affiche.');

  updateDoc() {
    const sel = document.getElementById('doc-update-select');
    const rev = document.getElementById('doc-update-rev').value.trim();
    const date = document.getElementById('doc-update-date').value;
    const notes = document.getElementById('doc-update-notes').value.trim();
    const fileInput = document.getElementById('doc-update-file');
    if (!sel.value) { alert('Selectionnez un document.'); return; }
    if (!rev) { alert('Indiquez le numero de revision.'); return; }
    if (!fileInput.files.length) { alert('Selectionnez le nouveau fichier.'); return; }
    const docs = this._getDocList();
    const doc = docs[parseInt(sel.value)];
    const file = fileInput.files[0];
    const ext = file.name.includes('.') ? '.' + file.name.split('.').pop().toLowerCase() : '';
    const isSource = ['xlsx', 'xls', 'docx', 'doc'].includes(ext.replace('.', ''));
    const srcName = doc.code + ' ' + rev + ext;
    const pdfName = doc.code + ' ' + rev + '.pdf';
    // Download source file renamed
    const reader = new FileReader();
    reader.onload = function() {
      const blob = new Blob([reader.result], { type: file.type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = srcName;
      a.click();
      URL.revokeObjectURL(a.href);
    };
    reader.readAsArrayBuffer(file);
    // Determine destination folders
    const pdfFolder = doc.path ? doc.path.substring(0, doc.path.lastIndexOf('/')) : '';
    const srcFolder = doc.pathEdit ? doc.pathEdit.substring(0, doc.pathEdit.lastIndexOf('/')) : '';
    // Archive previous version if exists
    const history = JSON.parse(localStorage.getItem('smq_doc_history') || '[]');
    const prevEntry = history.find(function(h) { return h.code === doc.code; });
    if (prevEntry) {
      const archives = JSON.parse(localStorage.getItem('smq_doc_archives') || '[]');
      archives.unshift({
        code: prevEntry.code,
        titre: prevEntry.titre,
        rev: prevEntry.rev,
        date: prevEntry.date,
        srcFile: prevEntry.srcFile || '',
        pdfFile: prevEntry.pdfFile || '',
        archivedOn: new Date().toLocaleDateString('fr-FR')
      });
      localStorage.setItem('smq_doc_archives', JSON.stringify(archives));
    }
    // Save to history
    const sess = AUTH.getSession();
    history.unshift({
      code: doc.code,
      titre: doc.titre,
      cat: doc.cat,
      rev: rev,
      date: date,
      notes: notes,
      srcFile: srcName,
      pdfFile: pdfName,
      by: sess ? sess.name : 'Admin',
      ts: new Date().toISOString()
    });
    localStorage.setItem('smq_doc_history', JSON.stringify(history));
    // Show instructions
    var msg = 'Document ' + doc.code + ' mis a jour en ' + rev + '\n\n';
    msg += '1. Fichier source telecharge : ' + srcName + '\n';
    if (srcFolder) msg += '   → Placez-le dans : ' + srcFolder + '/\n';
    if (isSource) {
      msg += '\n2. Creez le PDF :\n';
      msg += '   - Ouvrez ' + srcName + ' dans ' + (ext === '.docx' || ext === '.doc' ? 'Word' : 'Excel') + '\n';
      msg += '   - Fichier > Exporter > PDF\n';
      msg += '   - Nommez-le : ' + pdfName + '\n';
      if (pdfFolder) msg += '   - Enregistrez dans : ' + pdfFolder + '/\n';
    }
    if (prevEntry) {
      msg += '\n3. Archivage :\n';
      msg += '   L\'ancienne version (' + prevEntry.rev + ') a ete archivee.\n';
      msg += '   Deplacez les anciens fichiers dans ARCHIVES/\n';
      if (prevEntry.srcFile) msg += '   - ' + prevEntry.srcFile + '\n';
      if (prevEntry.pdfFile) msg += '   - ' + prevEntry.pdfFile + '\n';
    }
    alert(msg);
    APP.switchTab('admin');
  },

  _xlsWrap(title, sheetName, headerCells, dataRows) {
    var xml = '<?xml version="1.0" encoding="UTF-8"?>'
      + '<?mso-application progid="Excel.Sheet"?>'
      + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"'
      + ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
      + '<Styles>'
      + '<Style ss:ID="hdr"><Font ss:Bold="1" ss:Size="10"/><Interior ss:Color="#2563EB" ss:Pattern="Solid"/><Font ss:Color="#FFFFFF" ss:Bold="1"/></Style>'
      + '<Style ss:ID="title"><Font ss:Bold="1" ss:Size="12"/></Style>'
      + '<Style ss:ID="wrap"><Alignment ss:WrapText="1" ss:Vertical="Top"/></Style>'
      + '</Styles>'
      + '<Worksheet ss:Name="' + sheetName + '">'
      + '<Table>';
    // Title row
    xml += '<Row><Cell ss:StyleID="title"><Data ss:Type="String">' + title + '</Data></Cell></Row><Row></Row>';
    // Header
    xml += '<Row>';
    for (var i = 0; i < headerCells.length; i++) xml += '<Cell ss:StyleID="hdr"><Data ss:Type="String">' + headerCells[i] + '</Data></Cell>';
    xml += '</Row>';
    // Data
    for (var r = 0; r < dataRows.length; r++) {
      xml += '<Row>';
      for (var c = 0; c < dataRows[r].length; c++) {
        var val = (dataRows[r][c] || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        xml += '<Cell ss:StyleID="wrap"><Data ss:Type="String">' + val + '</Data></Cell>';
      }
      xml += '</Row>';
    }
    xml += '</Table></Worksheet></Workbook>';
    return xml;
  },

  function getFilters() {
    return {
      bat:   document.getElementById('cp-filtre-bat')?.value || '',
      date:  document.getElementById('cp-filtre-date')?.value || '',
      norme: document.getElementById('cp-filtre-norme')?.value || ''
    };
  }

  function saveFilters() {
    sessionStorage.setItem('cp_filters', JSON.stringify(getFilters()));
  }

  function restoreFilters() {
    try {
      const f = JSON.parse(sessionStorage.getItem('cp_filters') || '{}');
      if (f.bat) document.getElementById('cp-filtre-bat').value = f.bat;
      if (f.date) document.getElementById('cp-filtre-date').value = f.date;
      if (f.norme) document.getElementById('cp-filtre-norme').value = f.norme;
    } catch(e) {}
  }

  function normeVersion() {
    const f = getFilters();
    if (f.norme === 'v2024') return 'v2024';
    if (f.norme === 'v2002') return 'v2002';
    if (f.date === 'apres') return 'v2024';
    return 'v2002';
  }

  function filteredFAQ() {
    const f = getFilters();
    return FAQ.filter(item => {
      if (!f.bat) return true;
      if (f.bat === 'erp' && item.tags.includes('erp')) return true;
      if (f.bat === 'cdt' && item.tags.includes('cdt')) return true;
      if (f.bat === 'hab' && item.tags.includes('hab')) return true;
      if (item.tags.includes('elec') || item.tags.includes('vgp') || item.tags.includes('gaz') || item.tags.includes('incendie')) return true;
      return false;
    });
  }

  function renderFAQ() {
    const section = document.getElementById('cp-faq-section');
    const items = filteredFAQ();
    const btns = items.map((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'cp-faq-btn';
      btn.textContent = item.q;
      btn.onclick = () => CLAUDE_ASSIST.askFAQ(i);
      return btn;
    });
    section.textContent = '';
    const title = document.createElement('div');
    title.className = 'cp-faq-title';
    title.textContent = 'Questions frequentes';
    section.appendChild(title);
    const grid = document.createElement('div');
    grid.className = 'cp-faq-grid';
    btns.forEach(b => grid.appendChild(b));
    section.appendChild(grid);
  }

  function addMsg(text, cls) {
    const chat = document.getElementById('cp-chat');
    const div = document.createElement('div');
    div.className = 'cp-msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    document.getElementById('cp-divider').style.display = '';
    scrollBottom();
  }

  function scrollBottom() {
    const body = document.getElementById('cp-body');
    body.scrollTop = body.scrollHeight;
  }

  function showTyping() {
    const chat = document.getElementById('cp-chat');
    const div = document.createElement('div');
    div.className = 'cp-typing';
    div.id = 'cp-typing';
    for (let i = 0; i < 3; i++) div.appendChild(document.createElement('span'));
    chat.appendChild(div);
    scrollBottom();
  }

  function hideTyping() {
    const el = document.getElementById('cp-typing');
    if (el) el.remove();
  }

  function getApiKey() {
    return localStorage.getItem(API_KEY_LS) || '';
  }

  function updateNoKeyBanner() {
    const el = document.getElementById('cp-nokey');
    if (el) el.style.display = getApiKey() ? 'none' : '';
  }

  function buildSystemPrompt() {
    const f = getFilters();
    const batLabel = {erp:'ERP (Etablissement Recevant du Public)', cdt:'Etablissement relevant du Code du travail', hab:'Habitation'}[f.bat] || 'Non precise';
    const dateLabel = f.date === 'avant' ? 'avant mai 2025 (ancienne norme)' : f.date === 'apres' ? 'apres mai 2025 (nouvelle norme)' : 'non precise';
    const normeLabel = normeVersion() === 'v2024' ? 'NFC 15-100-1 (revision 2024)' : 'NFC 15-100 (version 2002)';
    return 'Tu es un assistant technique pour ARGOS SARL, bureau de controle reglementaire accredite COFRAC N\u00b03-0821. Tu reponds en francais.\n\nContexte de la question :\n- Type de batiment : ' + batLabel + '\n- Date du permis de construire / travaux : ' + dateLabel + '\n- Norme applicable : ' + normeLabel + '\n\nRegles :\n- Reponds de maniere concise et orientee terrain (inspecteur sur chantier).\n- Cite les articles de norme et textes reglementaires applicables.\n- Ne jamais inventer une reference normative. Si tu n\'es pas sur, dis-le.\n- Pour les ERP : cite les articles de l\'arrete du 25 juin 1980 quand applicable.\n- Pour le Code du travail : cite les articles R4226-xx et R4227-xx.\n- Si la question porte sur la renumerotation v2002 vers v2024, rappeler : NFC 15-100-XXX vers NFC 15-100-1-XXX, parties 7-XXX inchangees. Correspondances cles : 536.3/536.4 vers 537.3/464, 463 vers 465, 781 vers 7-729.\n- Adapte ta reponse a la version de norme selectionnee.\n- Maximum 300 mots.';
  }

  async function callClaude(question) {
    const key = getApiKey();
    if (!key) { addMsg('Cle API non configuree. Allez dans Admin pour la saisir.', 'error'); return; }

    _busy = true;
    document.getElementById('cp-send').disabled = true;
    showTyping();

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 1024,
          system: buildSystemPrompt(),
          messages: [{ role: 'user', content: question }]
        })
      });

      hideTyping();

      if (!res.ok) {
        const err = await res.text();
        if (res.status === 401) addMsg('Cle API invalide. Verifiez dans Admin.', 'error');
        else addMsg('Erreur API (' + res.status + ') : ' + err.substring(0, 200), 'error');
        return;
      }

      const data = await res.json();
      const answer = data.content?.[0]?.text || 'Pas de reponse.';
      addMsg(answer, 'bot');
    } catch (e) {
      hideTyping();
      addMsg('Erreur reseau : ' + e.message, 'error');
    } finally {
      _busy = false;
      document.getElementById('cp-send').disabled = false;
    }
  }

  return {
    toggle() {
      if (_open) this.close();
      else this.openPanel();
    },
    openPanel() {
      _open = true;
      document.getElementById('claude-panel').classList.add('open');
      document.getElementById('claude-overlay').classList.add('open');
      document.getElementById('claude-fab').classList.add('has-panel');
      restoreFilters();
      renderFAQ();
      updateNoKeyBanner();
    },
    close() {
      _open = false;
      document.getElementById('claude-panel').classList.remove('open');
      document.getElementById('claude-overlay').classList.remove('open');
      document.getElementById('claude-fab').classList.remove('has-panel');
    },
    onFilterChange() {
      saveFilters();
      renderFAQ();
    },
    askFAQ(idx) {
      const items = filteredFAQ();
      const item = items[idx];
      if (!item) return;
      addMsg(item.q, 'user');
      const ver = normeVersion();
      addMsg(item.r[ver] || item.r.v2002, 'bot');
    },
    send() {
      if (_busy) return;
      const input = document.getElementById('cp-input');
      const q = input.value.trim();
      if (!q) return;
      input.value = '';

      const match = FAQ.find(f => f.q.toLowerCase() === q.toLowerCase());
      if (match) {
        addMsg(q, 'user');
        addMsg(match.r[normeVersion()] || match.r.v2002, 'bot');
        return;
      }

      const f = getFilters();
      if (!f.bat || !f.date) {
        addMsg('Conseil : Renseignez le type de batiment et la date des travaux ci-dessus pour une reponse plus precise.', 'bot');
      }

      addMsg(q, 'user');
      callClaude(q);
    },
    goAdmin() {
      this.close();
      APP.switchTab('admin');
    },
    showFab() {
      document.getElementById('claude-fab').style.display = 'flex';
    }
  };
})();

// ── Init ──────────────────────────────────────────────
async function init() {
  await AUTH.initDefaultCreds();
  AUTH.loadCreds();
  // Auto-login si appareil enregistré
  const deviceUser = localStorage.getItem('smq_device_user');
  if (deviceUser) {
    const allUsers = ADMIN.getAllUsers();
    if (allUsers[deviceUser]) {
      AUTH.saveSession(deviceUser);
      LOGIN.init();
      APP.show(AUTH.getSession());
      return;
    }
  }
  LOGIN.init();
  const sess = AUTH.getSession();
  if (sess) APP.show(sess);
}

document.addEventListener('DOMContentLoaded', init);
</script>
